        /* Base Museum Card */
        .museum-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(18, 18, 16, 0.45);
            backdrop-filter: blur(12px);

            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .museum-card:hover {
            background: rgba(28, 28, 24, 0.6);
            border-color: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Active Museum Card */
        .museum-card-active {
            background: rgba(212, 175, 55, 0.04) !important;
            border-color: rgba(212, 175, 55, 0.7) !important;
            box-shadow: 0 10px 45px rgba(212, 175, 55, 0.12), 0 0 20px rgba(212, 175, 55, 0.03) !important;
            transform: scale(1.02);
        }

        /* Luxury Card Numbering */
        .museum-card-num {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            color: rgba(212, 175, 55, 0.3);
            width: 20px;
            text-align: center;
            transition: color 0.5s;
        }
        .museum-card-active .museum-card-num {
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* Luxury Thumbnails */
        .museum-card-thumb {
            width: 40px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            transition: border-color 0.5s;
        }
        .museum-card-active .museum-card-thumb {
            border-color: rgba(212, 175, 55, 0.6);
        }

        /* Custom Badges */
        .museum-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 8px;
            font-weight: 700;
            margin-top: 6px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            color: rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.01);
            letter-spacing: 0.08em;
            transition: all 0.5s;
        }
        .museum-badge-active {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 8px;
            font-weight: 700;
            margin-top: 6px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            letter-spacing: 0.08em;
            transition: all 0.5s;
        }
        
        /* Cinematic Curtain Animation */
        #curtainOverlay {
            background: transparent;
            pointer-events: auto;
        }
        .curtain-open {
            pointer-events: none !important;
        }
        .curtain-open #curtainLeft {
            transform: translateX(-100%);
        }
        .curtain-open #curtainRight {
            transform: translateX(100%);
        }
        .curtain-open #curtainBtn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }
        
        /* Pulse animation for curtain start button */
        @keyframes goldPulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        #curtainBtn {
            animation: goldPulse 2s infinite;
        }

        let globalAudioPlayer = null;
        
        function getAudioForVideo(videoSrc) {
            if (!videoSrc) return null;
            // Extract filename without path and extension
            const filename = videoSrc.split('/').pop().split('.').shift();
            
            let mapped = filename;
            
            // 1. Map character-specific filenames to generic 'color' equivalents
            const colors = ['red', 'blue', 'black', 'white', 'gray'];
            colors.forEach(color => {
                if (mapped === `${color}_dance`) mapped = 'color_dance';
                if (mapped === `${color}_to_big`) mapped = 'color_to_big';
                if (mapped === `stripe_to_${color}`) mapped = 'stripe_to_color';
                if (mapped === `reveal_${color}`) mapped = 'reveal_color';
                if (mapped === `${color}_outro`) mapped = 'color_outro';
            });
            
            // 2. Map curtain opening to curtain
            if (mapped === 'curtain') {
                mapped = 'curtain';
            }

            
            // 3. Alias mappings for silent videos (reuse existing audios)
            if (mapped === 'reveal_color') {
                mapped = 'curtain'; // Reuse curtain.mp3 for reveal
            }
            if (mapped === 'color_outro') {
                mapped = 'stripe_to_color'; // Reuse stripe_to_color.mp3 for outro
            }
            
            const AVAILABLE_AUDIOS = [
                'big_flower_to_round',
                'blue_flower_to_stripe',
                'color_dance',
                'color_to_big',
                'curtain',
                'intro',
                'round_to_blue_flower',
                'stripe_to_color'
            ];
            
            if (AVAILABLE_AUDIOS.includes(mapped)) {
                return `assets/audio/${mapped}.mp3`;
            }
            return null;
        }

        function syncAudioWithVideo(videoSrc, loop = false, seekTime = 0, speed = 1.0) {
            if (!globalAudioPlayer) {
                globalAudioPlayer = document.getElementById('globalBgmPlayer');
            }
            if (!globalAudioPlayer) return;
            
            const audioSrc = getAudioForVideo(videoSrc);
            if (audioSrc) {
                // If this BGM is already playing, let it continue without restarting!
                if (globalAudioPlayer.src && globalAudioPlayer.src.includes(audioSrc) && !globalAudioPlayer.paused) {
                    console.log(`[Audio Sync] BGM ${audioSrc} is already playing. Continuing...`);
                    globalAudioPlayer.loop = true;
                    globalAudioPlayer.playbackRate = speed;
                    return;
                }
                console.log(`[Audio Sync] Playing BGM: ${audioSrc} (loop=true, seek=${seekTime}s, speed=${speed}x)`);
                globalAudioPlayer.src = audioSrc;
                globalAudioPlayer.loop = true;
                globalAudioPlayer.volume = 0.6;
                globalAudioPlayer.currentTime = seekTime;
                globalAudioPlayer.playbackRate = speed; // Sync audio playback speed
                globalAudioPlayer.play().catch(e => console.warn("[Audio Sync] Play failed:", e));
            } else {
                console.log(`[Audio Sync] No matching BGM for ${videoSrc}. Stopping audio.`);
                globalAudioPlayer.pause();
                globalAudioPlayer.src = "";
            }
        }

        (function() {

                const consoleDiv = document.getElementById('logConsoleLines');

                function addLogLine(text, colorClass = 'text-gray-300') {
                    // Auto-reveal disabled for production showcase. Console stays permanently hidden.
                    if (consoleDiv) {
                        const line = document.createElement('div');

                    if (navigator.clipboard && navigator.clipboard.writeText) {

                function fallbackCopyText(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

        /**
         * Seamless Double-Buffered Video Player Helper
         */
        function playSeamlessVideo(src, loop = false, blendMode = 'normal', onendedCallback = null, freezeTimeRemaining = 0.06) {
            return new Promise((resolve, reject) => {
                const playerA = document.getElementById('videoPlayerA');
                const playerB = document.getElementById('videoPlayerB');
                if (!playerA || !playerB) { 
                    console.error("[Video System 🚨] Missing videoPlayerA or videoPlayerB elements!");
                    resolve(); 
                    return; 
                }
                
                const nextPlayer = (activePlayer === playerA) ? playerB : playerA;
                const prevPlayer = activePlayer;
                
                console.log(`[Video Loading 🎥] Switching source -> ${src} (loop: ${loop}, blend: ${blendMode})`);
                
                // Keep nextPlayer completely transparent while loading in background
                nextPlayer.style.opacity = '0';
                nextPlayer.classList.remove('opacity-100');
                nextPlayer.classList.add('opacity-0');
                
                if (!nextPlayer.src || !nextPlayer.src.includes(src) || nextPlayer.error || nextPlayer.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
                    nextPlayer.src = src;
                    nextPlayer.load();
                }
                nextPlayer.loop = loop;
                nextPlayer.style.mixBlendMode = blendMode;
                nextPlayer.currentTime = 0;
                nextPlayer.playbackRate = 1.0; // Reset playback rate
                nextPlayer.ontimeupdate = null; // Clear old listeners
                nextPlayer.onended = null;
                
                // Mute all videos to avoid browser autoplay/concurrency restrictions
                nextPlayer.muted = true;
                
                let isFinished = false;
                const finish = () => {
                    if (!isFinished) {
                        isFinished = true;
                        resolve();
                    }
                };

                nextPlayer.onplaying = function() {
                    console.log(`[Video Loading ✅] Video playing & fading in: ${src} (Player: ${nextPlayer.id})`);
                    nextPlayer.classList.remove('opacity-0');
                    nextPlayer.classList.add('opacity-100');
                    nextPlayer.style.opacity = '1';
                    
                    // Sync audio BGM
                    syncAudioWithVideo(src, loop);
                    
                    // Always hide static stage image once active video begins rendering
                    const stageImg = document.getElementById('stageFigurineImg');
                    if (stageImg) {
                        stageImg.classList.remove('opacity-100');
                        stageImg.classList.add('opacity-0', 'hidden');
                        stageImg.style.opacity = '0';
                    }

                    // Smoothly fade out curtain overlay (e.g. after curtain_close completes)
                    const curtainOverlay = document.getElementById('curtainOverlayPlayer');
                    if (curtainOverlay && parseFloat(curtainOverlay.style.opacity) > 0 && !src.includes('curtain.mp4')) {
                        curtainOverlay.style.transition = 'opacity 500ms ease-in-out';
                        curtainOverlay.style.opacity = '0';
                        setTimeout(() => { try { curtainOverlay.pause(); } catch(e){} }, 500);
                    }
                    
                    // Only hide previous player AFTER next player has rendered active frames!
                    if (prevPlayer && prevPlayer !== nextPlayer) {
                        setTimeout(() => {
                            prevPlayer.classList.remove('opacity-100');
                            prevPlayer.classList.add('opacity-0');
                            prevPlayer.style.opacity = '0';
                            try {
                                prevPlayer.pause();
                                prevPlayer.removeAttribute('src');
                                prevPlayer.load();
                            } catch(e){}
                        }, 120);
                    }
                    nextPlayer.onplaying = null;
                };
                
                if (!loop) {
                    const onEndedFallback = () => {
                        nextPlayer.ontimeupdate = null;
                        nextPlayer.onended = null;
                        console.log(`[Video Loading 🏁] Video ended (native ended event): ${src}`);
                        try {
                            nextPlayer.currentTime = Math.max(0, nextPlayer.duration - freezeTimeRemaining);
                            nextPlayer.playbackRate = 0.1;
                        } catch(e) {
                            console.warn("Failed to seek back on ended fallback:", e);
                        }
                        if (onendedCallback) onendedCallback();
                        finish();
                    };
                    nextPlayer.onended = onEndedFallback;

                    let targetLogFired = false;
                    nextPlayer.ontimeupdate = function() {
                        if (!window.lastPlayProgressLog || Date.now() - window.lastPlayProgressLog > 1000) {
                            console.log(`[Play Progress] ${src}: current=${nextPlayer.currentTime.toFixed(2)}, duration=${nextPlayer.duration.toFixed(2)}, paused=${nextPlayer.paused}, speed=${nextPlayer.playbackRate}`);
                            window.lastPlayProgressLog = Date.now();
                        }
                        if (nextPlayer.duration > 0.5 && nextPlayer.currentTime >= nextPlayer.duration - freezeTimeRemaining) {
                            nextPlayer.ontimeupdate = null;
                            nextPlayer.onended = null;
                            nextPlayer.playbackRate = 0.1;
                            console.log(`[Video Loading 🏁] Video ended (frozen on last frame): ${src}`);
                            if (onendedCallback) onendedCallback();
                            finish();
                        }
                    };
                }
                
                activePlayer = nextPlayer;
                nextPlayer.play().then(() => {
                    console.log(`[Video Loading ▶️] Play promise resolved for: ${src}`);
                    if (loop) finish();
                }).catch(e => {
                    console.warn(`[Video Loading ⚠️] Play failed with audio for ${src}, retrying muted fallback:`, e);
                    nextPlayer.muted = true;
                    nextPlayer.play().then(() => {
                        if (loop) finish();
                    }).catch(err => {
                        console.error("Fatal play error:", err);
                        finish();
                    });
                });
            });
        }

        let blessingSparksAnimId = null;
        function startBlessingSparks() {
            const canvas = document.getElementById('blessingSparksCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement?.offsetWidth || window.innerWidth;
            canvas.height = canvas.parentElement?.offsetHeight || window.innerHeight;
            
            const sparks = [];
            const colors = ['#ffffff', '#f2f7ff', '#e6f0ff', '#ffffff', '#d9e6ff', '#ffffff'];
            
            for (let i = 0; i < 50; i++) {
                sparks.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height * 0.4 + Math.random() * (canvas.height * 0.6),
                    radius: Math.random() * 2.8 + 1.2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: -(Math.random() * 1.8 + 0.8),
                    alpha: Math.random() * 0.8 + 0.2,
                    pulse: Math.random() * 0.04 + 0.02
                });
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                sparks.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.alpha += Math.sin(Date.now() * s.pulse) * 0.02;
                    s.alpha = Math.max(0.1, Math.min(1.0, s.alpha));
                    
                    if (s.y < 0 || s.x < 0 || s.x > canvas.width) {
                        s.x = Math.random() * canvas.width;
                        s.y = canvas.height;
                        s.alpha = Math.random() * 0.8 + 0.2;
                    }
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = s.alpha;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = s.color;
                    ctx.fill();
                    ctx.restore();
                });
                
                blessingSparksAnimId = requestAnimationFrame(animate);
            }
            
            if (blessingSparksAnimId) cancelAnimationFrame(blessingSparksAnimId);
            animate();
        }
        
        function stopBlessingSparks() {
            if (blessingSparksAnimId) {
                cancelAnimationFrame(blessingSparksAnimId);
                blessingSparksAnimId = null;

        function mapDescriptionToColor(text) {
            const lower = text.toLowerCase();
            
            const colorDefinitions = {
                '红': ['red', 'orange', 'yellow', 'pink', 'brown', '红', '黄', '橙', '褐'],
                '蓝': ['blue', 'green', 'cyan', 'purple', '蓝', '绿', '青', '紫'],
                '黑': ['black', 'dark', '黑'],
                '白': ['white', 'light', '白'],
                '灰': ['gray', 'grey', 'silver', '灰']
            };

            const anchors = ['dressed', 'wearing', 'outfit', 'shirt', 'clothing', 'top', 't-shirt', 'skirt', 'robe', 'garment', 'suit', 'dress', 'clothes', '衣', '衫', '裙', '袍'];
            
            // Find all anchor indices
            const anchorIndices = [];
            anchors.forEach(anchor => {
                let startIndex = 0;
                let idx;
                while ((idx = lower.indexOf(anchor, startIndex)) > -1) {
                    anchorIndices.push(idx);
                    startIndex = idx + anchor.length;
                }
            });

            if (anchorIndices.length === 0) {
                console.warn("[Color Map] No clothing anchors found in description! Using global simple matching.");
                // Fallback to simple matching
                for (let color in colorDefinitions) {
                    for (let kw of colorDefinitions[color]) {
                        if (lower.includes(kw)) return color;
                    }
                }
                return null; // DO NOT fallback to white if unrecognized!
            }

            let bestColor = null;
            let minDistance = 999999;

            for (let color in colorDefinitions) {
                const keywords = colorDefinitions[color];
                keywords.forEach(kw => {
                    let startIndex = 0;
                    let kwIdx;
                    while ((kwIdx = lower.indexOf(kw, startIndex)) > -1) {
                        // Look-ahead filter for modifiers 'dark' and 'light'
                        if (kw === 'dark' || kw === 'light') {
                            const followingText = lower.substring(kwIdx + kw.length, kwIdx + kw.length + 15);
                            let hasOtherColor = false;
                            for (let otherColor in colorDefinitions) {
                                const otherKeywords = colorDefinitions[otherColor];
                                for (let okw of otherKeywords) {
                                    if (okw !== 'dark' && okw !== 'light' && followingText.includes(okw)) {
                                        hasOtherColor = true;
                                        break;
                                    }
                                }
                                if (hasOtherColor) break;
                            }
                            if (hasOtherColor) {
                                console.log("[Color Map] Skipping modifier", kw, "followed by color in:", followingText);
                                startIndex = kwIdx + kw.length;
                                continue;
                            }
                        }

                        // Calculate min distance to any anchor
                        anchorIndices.forEach(aIdx => {
                            const dist = Math.abs(kwIdx - aIdx);
                            if (dist < minDistance) {
                                minDistance = dist;
                                bestColor = color;
                                console.log("[Color Map] New closest color:", color, "(kw:", kw, "at", kwIdx, ") to anchor at", aIdx, "dist:", dist);
                            }
                        });
                        
                        startIndex = kwIdx + kw.length;
                    }
                });
            }

            return bestColor;
        }

        async function classifyColorWithVLM(base64Image, useLocalAI) {
            if (!useLocalAI) {
                // Gemini Cloud VLM path
                const apiKey = document.getElementById('apiKey')?.value || '';
                let url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';
                if (apiKey) {
                    url += `?key=${apiKey}`;
                } else {
                    url = '/api/gemini';
                }
                
                const prompt = "Describe the clothing of the person in this image. What is the dominant color?";
                
                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                        ]
                    }],
                    generationConfig: { temperature: 0.1 }
                };
                
                const response = await fetchWithTimeout(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }, 10000);
                
                if (!response.ok) throw new Error(`Gemini API error: ${response.status}`);
                const resJson = await response.json();
                const text = resJson.candidates[0].content.parts[0].text;
                console.log("[Color Classifier] Gemini Cloud output:", text);
                const mapped = mapDescriptionToColor(text);
                return mapped ? { mappedColor: mapped, rawText: text } : null;
            } else {
                // Local Ollama Gemma Vision path (strictly locks to gemma4:e2b)
                const endpoint = document.getElementById('apiEndpoint')?.value || 'http://localhost:11434';
                
                // HTTPS Mixed Content Guard
                if (window.location.protocol === 'https:' && endpoint.startsWith('http:')) {
                    console.log("[AI Match] HTTPS mixed content guard: local HTTP Ollama endpoint bypassed on static HTTPS host.");
                    return null;
                }
                
                const cleanEndpoint = endpoint.replace(/\/v1\/?$/, '').replace(/\/$/, '');
                
                // Default to moondream as per README, fallback to gemma
                let modelName = "moondream";
                try {
                    const tagsRes = await fetchWithTimeout(`${cleanEndpoint}/api/tags`, { method: 'GET' }, 2000);
                    if (tagsRes.ok) {
                        const tagsJson = await tagsRes.json();
                        if (tagsJson.models && tagsJson.models.length > 0) {
                            let foundModel = tagsJson.models.find(m => (m.name || m.model || '').toLowerCase().includes('moondream'));
                            if (!foundModel) {
                                foundModel = tagsJson.models.find(m => (m.name || m.model || '').toLowerCase().includes('gemma'));
                            }
                            if (foundModel) {
                                modelName = foundModel.name || foundModel.model;
                            }
                        }
                    }
                } catch (e) {
                    console.warn(`[Gemma Vision 🦙] Auto-detect model failed, using default: "${modelName}"`, e);
                }
                console.log(`[Gemma Vision 🦙] Strictly using Gemma Vision Model: "${modelName}"`);
                
                const url = `${cleanEndpoint}/api/generate`;
                const system = "You are an AI vision classifier. Look at the upper clothing of the person in this photo. Choose strictly from: Black, White, Red, Blue, Gray. Output only the single color name.";
                const prompt = "What is the dominant color of the upper clothing in this photo? Black, White, Red, Blue, or Gray?";
                
                const payload = {
                    model: modelName,
                    system: system,
                    prompt: prompt,
                    images: [base64Image],
                    stream: false,
                    options: {
                        temperature: 0.0,
                        num_predict: 10
                    }
                };
                
                console.log(`[Gemma Vision 🦙] Sending vision classification request to ${modelName} (8.0s timeout)...`);
                const response = await fetchWithTimeout(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }, 8000); // 8.0s timeout per user directive
                
                if (!response.ok) throw new Error(`Local VLM error: ${response.status} (Model: ${modelName})`);
                const resJson = await response.json();
                const text = (resJson.response || resJson.message?.content || "").trim();
                console.log(`[Gemma Vision 🦙] Output from ${modelName}: "${text}"`);
                const mapped = mapDescriptionToColor(text);
                return mapped ? { mappedColor: mapped, rawText: text } : null;
            }
        }

        /**
         * Real-time Computer Vision Torso Color Sensor (0.005s instant, 100% reliable)
         * Directly samples chest/torso pixels from the webcam frame in HSV color space.
         */
        function detectDominantTorsoColor(videoEl, lm) {
            if (!videoEl || !videoEl.videoWidth) return '白';
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 160;
                canvas.height = 160;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, 160, 160);
                
                // Torso center chest region (exclude neck, face, and outer background)
                let minX = 45, maxX = 115, minY = 55, maxY = 115;
                if (lm && lm[11] && lm[12]) {
                    const sLX = lm[11].x * 160;
                    const sRX = lm[12].x * 160;
                    const sY = ((lm[11].y + lm[12].y) / 2) * 160;
                    let hY = sY + Math.abs(sLX - sRX) * 1.3;
                    if (lm[23] && lm[24]) hY = ((lm[23].y + lm[24].y) / 2) * 160;
                    
                    const shoulderSpan = Math.abs(sLX - sRX);
                    const centerX = (sLX + sRX) / 2;
                    minX = Math.max(5, centerX - shoulderSpan * 0.20);
                    maxX = Math.min(155, centerX + shoulderSpan * 0.20);
                    minY = Math.max(5, sY + shoulderSpan * 0.15);
                    maxY = Math.min(155, Math.min(hY - 5, sY + shoulderSpan * 0.55));
                }
                
                const w = Math.max(10, Math.round(maxX - minX));
                const h = Math.max(10, Math.round(maxY - minY));
                const imgData = ctx.getImageData(Math.round(minX), Math.round(minY), w, h);
                const d = imgData.data;
                
                let black = 0, white = 0, gray = 0, red = 0, blue = 0, total = 0;
                
                for (let i = 0; i < d.length; i += 16) {
                    const r = d[i], g = d[i+1], b = d[i+2];
                    // Skip skin tones (chin/neck/chest skin)
                    if (r > 135 && g > 85 && b > 65 && r > g && g > b && (r - g) < 70 && (r - b) > 30) continue;
                    
                    total++;
                    const max = Math.max(r, g, b) / 255;
                    const min = Math.min(r, g, b) / 255;
                    const delta = max - min;
                    let hue = 0;
                    const sat = max === 0 ? 0 : delta / max;
                    const val = max;
                    
                    if (delta !== 0) {
                        if (max === r / 255) hue = ((g / 255 - b / 255) / delta + (g < b ? 6 : 0)) / 6;
                        else if (max === g / 255) hue = ((b / 255 - r / 255) / delta + 2) / 6;
                        else hue = ((r / 255 - g / 255) / delta + 4) / 6;
                    }
                    const deg = hue * 360;
                    // Map to 0-100 scale for HSV matching to align with scratch code
                    const h = deg;
                    const s = sat * 100;
                    const v = val * 100;
                    
                    // Standard HSV decision tree from scratch version (checks saturation first to filter white/gray/black)
                    if (v < 22) {
                        black++;
                    } else if (s < 30) { // Increased from 18 to 30 to tolerate red-bleed reflections on white shirts
                        if (v > 70) white++; // Lowered from 75 to 70 to match shadowed white clothes
                        else gray++;
                    } else if (h < 25 || h > 335) {
                        red++;
                    } else if (h >= 170 && h <= 265) {
                        blue++;
                    }
                }
                
                const scores = [
                    { c: '白', cnt: white },
                    { c: '黑', cnt: black },
                    { c: '红', cnt: red },
                    { c: '蓝', cnt: blue },
                    { c: '灰', cnt: gray }
                ];
                scores.sort((a, b) => b.cnt - a.cnt);
                const winner = scores[0].c;
                console.log(`[Pixel Color Sensor 🎨] Winner: "${winner}" (White:${Math.round(white)}, Black:${Math.round(black)}, Red:${Math.round(red)}, Blue:${Math.round(blue)}, Gray:${Math.round(gray)})`);
                return winner;
            } catch(e) {
                console.warn("Pixel color detect error:", e);
                return '白';
            }
        }

        /**
         * Preload all spin transition and dance videos into browser memory for 0ms instant switching
         */
        function preloadSpinVideos(colorId) {
            const list = [
                `video/${colorId}_to_big.mp4`,
                "video/big_flower_to_round.mp4",
                "video/round_to_blue_flower.mp4",
                "video/blue_flower_to_stripe.mp4",
                `video/stripe_to_${colorId}.mp4`,
                `video/${colorId}_dance.mp4`,
                `video/reveal_${colorId}.mp4`,
                `video/${colorId}_outro.mp4`
            ];
            list.forEach(src => {
                const v = document.createElement('video');
                v.preload = 'auto';
                v.src = src;
                v.muted = true;
                v.load();
            });
        }

        async function triggerSilentBackgroundMatch() {
            if (window.isColorLocked) return; // Do not sample or overwrite once cinematic flow has locked the matched color!

            // 1. INSTANT COMPUTER VISION TORSO PIXEL SENSOR (0.005s Instant Detection)
            const instantColor = detectDominantTorsoColor(webcamElement, window.mocap?.lastLandmarks);
            
            // Only update DOM, card details and stage image if color actually changed to avoid 30fps thrashes
            if (instantColor !== window.detectedColor) {
                window.detectedColor = instantColor;
                const instantFigurine = matchFigurineByColor(instantColor);
                window.matchedFigurineId = instantFigurine.id;
                updateMuseumInfoCard(instantFigurine);
                
                const stageImg = document.getElementById('stageFigurineImg');
                if (stageImg && instantFigurine.reveal0sImage) {
                    stageImg.src = instantFigurine.reveal0sImage;
                }
            }
            if (window.enableVLM) {
                updateTrackingBadge("success", `衣服识别: ${window.detectedColor} (AI 视觉分析中)`);

                // 2. GEMMA 4 VLM VISION RECOGNITION (Vision-Language Model Background Classification)
                if (window.isVlmMatching) return;
                window.isVlmMatching = true;

                window.gemmaVlmPromise = (async () => {
                    try {
                        const hiddenCanvas = document.createElement('canvas');
                        hiddenCanvas.width = 160;
                        hiddenCanvas.height = 160;
                        const ctx = hiddenCanvas.getContext('2d');
                        
                        // Smart Torso Bbox Cropping: Crop strictly around shoulder/chest landmarks
                        const lm = window.mocap?.lastLandmarks;
                        const vw = webcamElement.videoWidth || 640;
                        const vh = webcamElement.videoHeight || 480;
                        let srcX = 0, srcY = 0, srcW = vw, srcH = vh;
                        
                        if (lm && lm[11] && lm[12]) {
                            const sLX = lm[11].x * vw;
                            const sRX = lm[12].x * vw;
                            const sY = ((lm[11].y + lm[12].y) / 2) * vh;
                            const shoulderSpan = Math.abs(sLX - sRX);
                            const centerX = (sLX + sRX) / 2;
                            
                            srcX = Math.max(0, centerX - shoulderSpan * 0.65);
                            srcY = Math.max(0, sY);
                            srcW = Math.min(vw - srcX, shoulderSpan * 1.3);
                            srcH = Math.min(vh - srcY, shoulderSpan * 1.4);
                        }
                        
                        ctx.drawImage(webcamElement, srcX, srcY, srcW, srcH, 0, 0, 160, 160);
                        const base64Image = hiddenCanvas.toDataURL('image/jpeg', 0.80).split(',')[1];
                        const useLocalAI = document.getElementById('useLocalAI')?.checked ?? true;
                        
                        const result = await classifyColorWithVLM(base64Image, useLocalAI);
                        if (result && result.mappedColor) {
                            console.log(`[Gemma Vision 🦙] Gemma AI vision matched color: "${result.mappedColor}" (Raw: "${result.rawText}")`);
                            window.detectedColor = result.mappedColor;
                            const refinedFigurine = matchFigurineByColor(window.detectedColor);
                            window.matchedFigurineId = refinedFigurine.id;
                            updateMuseumInfoCard(refinedFigurine);
                            if (stageImg && refinedFigurine.reveal0sImage) {
                                stageImg.src = refinedFigurine.reveal0sImage;
                            }
                            preloadSpinVideos(refinedFigurine.id);
                            updateTrackingBadge("success", `AI 视觉识别: ${window.detectedColor}`);
                        }
                    } catch (e) {
                        console.log("[Gemma Vision 🦙] Gemma Vision refinement skipped:", e.message);
                    } finally {
                        window.isVlmMatching = false;
                    }
                })();
            } else {
                updateTrackingBadge("success", `衣服识别: ${window.detectedColor}`);
            }
        }

        function setAwakenButtonReady(ready, color = null) {
            const btn = document.getElementById('awakenButton');

            if (!btn || !textSpan) return;

                textSpan.innerHTML = "✨ 时空共鸣，点击唤醒 ✨";
                window.detectedColor = color;
            } else {
                btn.setAttribute('disabled', 'true');
                btn.className = "px-8 py-4 bg-[#1a1105]/95 text-amber-500/50 border-2 border-amber-500/20 rounded-full font-classical text-lg font-bold tracking-widest shadow-[0_0_20px_rgba(212,175,55,0.05)] transition-all duration-300 cursor-not-allowed";
                textSpan.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-amber-500 mr-3 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    正在感应穿搭...
                `;

        /**
         * Updates the clothing mesh colors in Three.js to match the OOTD hue
         */
        function updateMannequinColorPalette(colorTag) {
            if (!avatar || !avatar.scene) return;
            
            let primaryHex = 0x2e7d32; // Default Sancai Green
            if (colorTag === "红/黄/橙") primaryHex = 0xd32f2f; // Red
            if (colorTag === "蓝/青") primaryHex = 0x1976d2; // Blue
            if (colorTag === "黑/白/灰") primaryHex = 0x455a64; // Gray
            if (colorTag === "多色/印花") primaryHex = 0x7b1fa2; // Purple
            
            avatar.scene.traverse((child) => {
                if (child.isMesh && child.material && child.userData.isClothing && !child.userData.ignorePaletteUpdate) {
                    child.material.color.setHex(primaryHex);
                }
            });
            console.log(`Mannequin clothing colors updated to matched OOTD hue: ${colorTag}`);
        }


        // ================= MOTION CAPTURE ENGINE INITIALIZATION =================

        /**
         * Instantiates the MediaPipe Motion Capture Engine
         */
        async function createMocapEngine() {
            if (mocap) {
                mocap.stop();
                mocap = null;
            }
            
            if (webcamElement.videoWidth === 0 || webcamElement.videoHeight === 0) {
                console.log("[Orchestrator] Webcam dimensions are 0x0, awaiting loadeddata...");
                await new Promise((resolve) => {
                    webcamElement.addEventListener('loadeddata', () => resolve(), { once: true });
                    setTimeout(resolve, 500); // Safety timeout
                });
            }
            
            mocap = new MotionCaptureEngine(webcamElement);
            initializeMocapCallbacks();
            mocap.start();
        }

        /**
         * Wires up callbacks for the mocap engine
         */
        function initializeMocapCallbacks() {
            if (!mocap) return;
            
            // Set default active pose key
            mocap.activePoseKey = window.currentActivePoseKey || 'optimal_1';
            
            // We don't use these score callbacks in the new cinematic flow,
            // but we keep them to prevent any null reference crashes in the engine.
            mocap.onPoseScore = function(score) {
                if (currentState === AppState.STANDBY_WAIT) {
                    updateTrackingBadge("info", `时空同频中: ${score}%`);
                }
            };
            mocap.onPoseSuccess = function(poseKey) {
                console.log(`[Mocap Callback] Pose success! PoseKey: ${poseKey}`);
                if (poseKey === 'spread_arms') {
                    if (typeof window.onUserSpin === 'function') {
                        window.onUserSpin();
                    }
                } else {
                    triggerMainDance();
                }
            };
        }

        // ================= UTILITY HELPERS =================

        

        /**
         * Synthesizes a beautiful chime sound using Web Audio API
         */
        function playChimeEffect() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.3); // E6
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.55);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch(e) {
                console.warn("Failed to play Web Audio chime:", e);
            }
        }

        /**
         * Updates the top-left tracking status badge text and color
         */
        function updateTrackingBadge(status, text) {
            const badge = document.getElementById('trackingStatus');
            const dot = document.getElementById('statusDot');
            if (!badge || !dot) return;
            
            let colorClass = "bg-error";
            if (status === 'success') colorClass = "bg-success animate-ping";
            if (status === 'info') colorClass = "bg-info";
            if (status === 'warning') colorClass = "bg-warning";
            
            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full mr-1.5 ${colorClass}" id="statusDot"></span> ${text}`;
        }

        



        // Bypassed legacy functions kept to prevent reference errors
        function updateSilhouetteSVG(poseKey) {}
        function skipPoseChallenge() {
            console.log("[Debug] Direct awakening to Sancai dance!");
            resetKiosk();
            
            // Hide start overlay
            const startOverlay = document.getElementById('startOverlay');
            if (startOverlay) {
                startOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
            
            currentState = AppState.STANDBY_WAIT;
            triggerMainDance();
        }
